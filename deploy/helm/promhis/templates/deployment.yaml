apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promhis.fullname" . }}
  labels:
    {{- include "promhis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "promhis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "promhis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Kubernetes auto-injects a `{SERVICE}_PORT`/`{SERVICE}_SERVICE_PORT`-
      # style env var per Service in this namespace (legacy Docker-links
      # behavior) — since the Service here is named "promhis", that becomes
      # `PROMHIS_PORT=tcp://<clusterIP>:8000`, colliding with this app's own
      # `PROMHIS_PORT` setting (same env_prefix) and crashing it at startup.
      enableServiceLinks: false
      serviceAccountName: {{ include "promhis.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "promhis.postgresFullname" . }} -p 5432 -U {{ .Values.postgresql.auth.username | quote }}; do sleep 2; done
      {{- end }}
      containers:
        - name: promhis
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          env:
            - name: PROMHIS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.admin.existingSecretUserKey "admin-user" (ne .Values.admin.existingSecret "") }}
            - name: PROMHIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.admin.existingSecretPasswordKey "admin-password" (ne .Values.admin.existingSecret "") }}
            - name: PROMHIS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sessionSecret.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.sessionSecret.existingSecretKey "session-secret" (ne .Values.sessionSecret.existingSecret "") }}
            - name: PROMHIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ include "promhis.fullname" . }}
                  key: database-url
                  {{- else }}
                  name: {{ .Values.database.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.database.existingSecretKey "database-url" (ne .Values.database.existingSecret "") }}
                  {{- end }}
            - name: PROMHIS_RETENTION_DAYS
              value: {{ .Values.retentionDays | quote }}
            {{- if .Values.alertmanager.url }}
            - name: PROMHIS_ALERTMANAGER_URL
              value: {{ .Values.alertmanager.url | quote }}
            - name: PROMHIS_ALERTMANAGER_POLL_SECONDS
              value: {{ .Values.alertmanager.pollSeconds | quote }}
            {{- end }}
            - name: PROMHIS_WEBHOOK_AUTH_MODE
              value: {{ .Values.webhook.authMode | quote }}
            {{- if eq .Values.webhook.authMode "bearer" }}
            - name: PROMHIS_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webhook.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.webhook.existingSecretKey "webhook-token" (ne .Values.webhook.existingSecret "") }}
            {{- end }}
            - name: PROMHIS_TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            - name: PROMHIS_METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.user }}
            - name: PROMHIS_METRICS_USER
              value: {{ .Values.metrics.user | quote }}
            {{- end }}
            {{- if or .Values.metrics.password .Values.metrics.existingSecret }}
            - name: PROMHIS_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.metrics.existingSecretPasswordKey "metrics-password" (ne .Values.metrics.existingSecret "") }}
            {{- end }}
            {{- if .Values.metrics.allowedIPs }}
            - name: PROMHIS_METRICS_ALLOWED_IPS
              value: {{ .Values.metrics.allowedIPs | quote }}
            {{- end }}
            {{- if .Values.branding.name }}
            - name: PROMHIS_BRAND_NAME
              value: {{ .Values.branding.name | quote }}
            {{- end }}
            {{- if .Values.branding.logoPath }}
            - name: PROMHIS_BRAND_LOGO_PATH
              value: {{ .Values.branding.logoPath | quote }}
            {{- end }}
            {{- if .Values.publicBaseUrl }}
            - name: PROMHIS_PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            {{- end }}
            {{- if .Values.digest.to }}
            - name: PROMHIS_DIGEST_TO
              value: {{ .Values.digest.to | quote }}
            - name: PROMHIS_DIGEST_HOUR_UTC
              value: {{ .Values.digest.hourUtc | quote }}
            - name: PROMHIS_SMTP_HOST
              value: {{ .Values.digest.smtp.host | quote }}
            - name: PROMHIS_SMTP_PORT
              value: {{ .Values.digest.smtp.port | quote }}
            {{- if .Values.digest.smtp.user }}
            - name: PROMHIS_SMTP_USER
              value: {{ .Values.digest.smtp.user | quote }}
            {{- end }}
            {{- if or .Values.digest.smtp.password .Values.digest.smtp.existingSecret }}
            - name: PROMHIS_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.digest.smtp.existingSecret | default (include "promhis.fullname" .) }}
                  key: {{ ternary .Values.digest.smtp.existingSecretPasswordKey "smtp-password" (ne .Values.digest.smtp.existingSecret "") }}
            {{- end }}
            - name: PROMHIS_SMTP_FROM
              value: {{ .Values.digest.smtp.from | quote }}
            - name: PROMHIS_SMTP_USE_TLS
              value: {{ .Values.digest.smtp.useTls | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
