{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "promhis.postgresFullname" . }}
  labels:
    {{- include "promhis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  postgres-password: {{ include "promhis.postgresPassword" . | b64enc }}

---
{{- if and .Values.postgresql.persistence.enabled (not .Values.postgresql.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "promhis.postgresFullname" . }}
  labels:
    {{- include "promhis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  {{- with .Values.postgresql.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.postgresql.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
  {{- if .Values.postgresql.persistence.storageClassName }}
  storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
  {{- end }}
{{- else if not .Values.postgresql.persistence.enabled }}
{{- fail "postgresql.enabled is true but postgresql.persistence.enabled is false — your alert history would live on ephemeral pod storage and vanish on every restart. Either enable persistence or point database.url at an external Postgres instead (with postgresql.enabled: false)." }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "promhis.postgresFullname" . }}
  labels:
    {{- include "promhis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "promhis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promhis.postgresFullname" . }}
  labels:
    {{- include "promhis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "promhis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "promhis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "promhis.postgresFullname" . }}
                  key: postgres-password
            # Postgres refuses to initialize directly into a non-empty
            # mount point (some CSI drivers leave a lost+found directory at
            # the volume root) — a subdirectory sidesteps that entirely.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.persistence.existingClaim | default (include "promhis.postgresFullname" .) }}
{{- end }}
