{{- if not .Values.admin.existingSecret }}
{{- if not .Values.admin.password }}
{{- fail "admin.password (or admin.existingSecret) must be set — refusing to install with no admin password. See the chart README." }}
{{- end }}
{{- end }}
{{- if not .Values.sessionSecret.existingSecret }}
{{- if not .Values.sessionSecret.value }}
{{- fail "sessionSecret.value (or sessionSecret.existingSecret) must be set — generate one with: python3 -c \"import secrets; print(secrets.token_urlsafe(32))\"" }}
{{- end }}
{{- end }}
{{- if and (eq .Values.webhook.authMode "bearer") (not .Values.webhook.existingSecret) (not .Values.webhook.token) }}
{{- fail "webhook.authMode is \"bearer\" but neither webhook.token nor webhook.existingSecret is set." }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.url) (not .Values.database.existingSecret) }}
{{- fail "postgresql.enabled is false but neither database.url nor database.existingSecret is set." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "promhis.fullname" . }}
  labels:
    {{- include "promhis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.admin.existingSecret }}
  admin-user: {{ .Values.admin.user | b64enc }}
  admin-password: {{ .Values.admin.password | b64enc }}
  {{- end }}
  {{- if not .Values.sessionSecret.existingSecret }}
  session-secret: {{ .Values.sessionSecret.value | b64enc }}
  {{- end }}
  {{- if and (eq .Values.webhook.authMode "bearer") (not .Values.webhook.existingSecret) }}
  webhook-token: {{ .Values.webhook.token | b64enc }}
  {{- end }}
  {{- if and .Values.metrics.password (not .Values.metrics.existingSecret) }}
  metrics-password: {{ .Values.metrics.password | b64enc }}
  metrics-user: {{ .Values.metrics.user | default "" | b64enc }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username (include "promhis.postgresPassword" .) (include "promhis.postgresFullname" .) .Values.postgresql.auth.database | b64enc }}
  {{- else if and .Values.database.url (not .Values.database.existingSecret) }}
  database-url: {{ .Values.database.url | b64enc }}
  {{- end }}
  {{- if and .Values.digest.smtp.password (not .Values.digest.smtp.existingSecret) }}
  smtp-password: {{ .Values.digest.smtp.password | b64enc }}
  {{- end }}
