<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% filter replace("Promhis", brand_name()) %}{% block title %}Promhis{% endblock %}{% endfilter %}</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("promhis-theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
          integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt"
          crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"
          integrity="sha384-DsT1q/+aTIkNUICSMoPHLh8RDdgN2BaPm3ThHPGAuETCIdf1vPGwFsoMy/SrKZ7W"
          crossorigin="anonymous" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  {% if active %}
  <header class="rail">
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="rail-nav">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="plate">
      <span class="plate-text">
        {% if brand_logo_url() %}<img class="brand-logo" src="{{ brand_logo_url() }}" alt="{{ brand_name() }}">{% else %}<span class="flame">&#9650;</span>{% endif %}
        {{ brand_name() }}
      </span>
    </div>
    <div class="nav-backdrop" id="nav-backdrop"></div>
    <nav class="rail-nav" id="rail-nav" hx-boost="true" hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML show:none">
      <a class="tab {% if active == 'overview' %}is-active{% endif %}" href="/">Overview</a>
      <a class="tab {% if active == 'alerts' %}is-active{% endif %}" href="/alerts">Alerts</a>
      <a class="tab {% if active == 'nodes' %}is-active{% endif %}" href="/nodes">Nodes</a>
      <a class="tab {% if active == 'stats' %}is-active{% endif %}" href="/stats">Stats</a>
      <a class="tab {% if active == 'audit-log' %}is-active{% endif %}" href="/audit-log">Audit Log</a>
      <a class="tab {% if active == 'api-tokens' %}is-active{% endif %}" href="/api-tokens">API Tokens</a>
      <a class="tab {% if active == 'integrations' %}is-active{% endif %}" href="/integrations">Integrations</a>
      <a class="tab {% if active == 'routing' %}is-active{% endif %}" href="/routing">Routing</a>
      <a class="tab {% if active == 'admin-users' %}is-active{% endif %}" href="/admin-users">Admin Users</a>
    </nav>
    <div class="rail-spacer"></div>
    <div class="rail-meta">
      <a class="icon-btn {% if active == 'settings' %}is-active{% endif %}" href="/settings" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <form action="/logout" method="post" style="margin:0;">
        <button class="logout-btn" type="submit">Sign out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
