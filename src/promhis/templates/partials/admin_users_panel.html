<div id="admin-users-panel">
<div class="panel">
  <div class="panel-head"><h2>Add an admin</h2></div>
  <div class="panel-body">
    <form hx-post="/admin-users" hx-target="#admin-users-panel" hx-swap="outerHTML"
          hx-on:htmx:after-request="if(event.detail.successful) this.reset()"
          method="post" action="/admin-users" class="filter-bar inline-filter-bar">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn" type="submit">Create admin</button>
    </form>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h2>Admin accounts</h2></div>
  <div class="panel-body flush">
    <table class="register">
      <thead>
        <tr><th>Username</th><th>Created</th><th>Last login</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        {% for u in users %}
        {% include "partials/admin_user_row.html" %}
        {% else %}
        <tr class="empty-row"><td colspan="5">
          <div class="empty-state"><div class="glyph">—</div>No admin accounts yet.</div>
        </td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
</div>
