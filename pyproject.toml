[project]
name = "promhis"
version = "0.1.0"
description = "History and dashboard for Prometheus Alertmanager alerts"
readme = "README.md"
license = "MIT"
authors = [
    { name = "tom-jm69", email = "tom-jm69@users.noreply.github.com" }
]
keywords = ["prometheus", "alertmanager", "monitoring", "alerting", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.38.0",
    "sqlmodel>=0.0.24",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.11.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "basedpyright>=1.40.2",
    "asyncpg>=0.30.0",
    "itsdangerous>=2.2.0",
    "greenlet>=3.1.1",
    "cryptography>=43.0.0",
    "prometheus-client>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/tom-jm69/promhis"
Repository = "https://github.com/tom-jm69/promhis"
Documentation = "https://github.com/tom-jm69/promhis/tree/main/docs"

[project.scripts]
promhis = "promhis.cli:main"
promhis-seed = "promhis.seed:main"
promhis-license = "promhis.license_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv_build]
module-root = "src"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
